services:
  - type: web
    name: mentorclick-ai-studio
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_VIDEO_MODEL
        value: sora-2
